<script>
  // ===== Global holat =====
  var state = {
    phone: '',
    isAdmin: false,
    pricing: [],
    products: [],
    productLinks: {},
    adminOrders: []
  };

  // ===== Yordamchilar =====
  function $(id) { return document.getElementById(id); }

  function showView(id) {
    var views = document.querySelectorAll('.view');
    for (var i = 0; i < views.length; i++) views[i].classList.remove('active');
    $(id).classList.add('active');
    window.scrollTo(0, 0);
  }

  function showLoader(on) {
    $('loader').classList.toggle('hidden', !on);
  }

  function setMsg(id, text, type) {
    var el = $(id);
    el.textContent = text || '';
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Telefon input formatlash: +998 (xx) xxx-xx-xx
  function normalizePhoneInput(el) {
    var digits = el.value.replace(/\D/g, '');
    if (digits.indexOf('998') === 0) digits = digits.substring(3);
    digits = digits.substring(0, 9);
    var out = '+998';
    if (digits.length > 0) {
      out += ' (' + digits.substring(0, 2);
      if (digits.length >= 2) out += ')';
    }
    if (digits.length > 2) out += ' ' + digits.substring(2, 5);
    if (digits.length > 5) out += '-' + digits.substring(5, 7);
    if (digits.length > 7) out += '-' + digits.substring(7, 9);
    el.value = out;
  }

  // Har qanday telefon matnini ko'rsatish uchun formatlaydi: +998 (xx) xxx-xx-xx
  function formatPhoneStr(raw) {
    var d = String(raw).replace(/\D/g, '');
    if (d.indexOf('998') === 0) d = d.substring(3);
    d = d.substring(0, 9);
    if (d.length < 9) return String(raw);
    return '+998 (' + d.substring(0, 2) + ') ' + d.substring(2, 5) + '-' + d.substring(5, 7) + '-' + d.substring(7, 9);
  }

  // Karta input formatlash: xxxx xxxx xxxx xxxx (16 raqam)
  function formatCardInput(el) {
    var d = el.value.replace(/\D/g, '').substring(0, 16);
    var groups = d.match(/.{1,4}/g);
    el.value = groups ? groups.join(' ') : '';
  }

  // ===== 1-QADAM: TELEFON =====
  function submitPhone() {
    var phone = $('phoneInput').value;
    var digits = phone.replace(/\D/g, '');
    if (digits.length < 12) { // 998 + 9 raqam
      setMsg('loginMsg', 'Iltimos, to\'liq telefon raqamini kiriting (+998 XX XXX XX XX).', 'error');
      return;
    }
    setMsg('loginMsg', '');
    $('phoneBtn').disabled = true;
    showLoader(true);

    google.script.run
      .withSuccessHandler(function (res) {
        showLoader(false);
        $('phoneBtn').disabled = false;
        if (!res.ok) {
          setMsg('loginMsg', res.message, 'error');
          return;
        }
        state.phone = res.phone;
        state.isAdmin = res.isAdmin;
        if (res.isAdmin) {
          // Admin -> parol so'raymiz
          $('adminPhoneLabel').textContent = phone;
          $('phoneStep').classList.add('hidden');
          $('passwordStep').classList.remove('hidden');
          $('passwordInput').focus();
        } else {
          // Oddiy foydalanuvchi -> buyurtma paneli
          openOrderPanel();
        }
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        $('phoneBtn').disabled = false;
        setMsg('loginMsg', 'Server xatosi: ' + err.message, 'error');
      })
      .checkPhone(phone);
  }

  // ===== 2-QADAM: PAROL (admin) =====
  function submitPassword() {
    var pass = $('passwordInput').value;
    if (!pass) {
      setMsg('loginMsg', 'Parolni kiriting.', 'error');
      return;
    }
    setMsg('loginMsg', '');
    $('passwordBtn').disabled = true;
    showLoader(true);

    google.script.run
      .withSuccessHandler(function (res) {
        showLoader(false);
        $('passwordBtn').disabled = false;
        if (!res.ok) {
          setMsg('loginMsg', res.message, 'error');
          return;
        }
        openAdminPanel();
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        $('passwordBtn').disabled = false;
        setMsg('loginMsg', 'Server xatosi: ' + err.message, 'error');
      })
      .verifyAdminPassword(state.phone, pass);
  }

  function backToPhone() {
    $('passwordStep').classList.add('hidden');
    $('phoneStep').classList.remove('hidden');
    $('passwordInput').value = '';
    setMsg('loginMsg', '');
  }

  // ===== BUYURTMA PANELI =====
  function openOrderPanel() {
    showView('orderView');
    $('orderUserPhone').textContent = formatPhoneStr(state.phone);
    showLoader(true);

    // Avval narxlanishni yuklaymiz
    google.script.run
      .withSuccessHandler(function (pricing) {
        state.pricing = pricing || [];
        fillMahsulotSelect();
        loadProductsThenOrders();
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        setMsg('orderMsg', 'Narxlarni yuklashda xatolik: ' + err.message, 'error');
      })
      .getPricing();
  }

  // Mahsulotlar (yuklab olish havolalari) va so'ng buyurtmalarni yuklaydi
  function loadProductsThenOrders() {
    google.script.run
      .withSuccessHandler(function (products) {
        state.products = products || [];
        state.productLinks = {};
        state.products.forEach(function (p) { state.productLinks[p.nomi] = p.havola; });
        loadUserOrders();
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        setMsg('orderMsg', 'Mahsulotlarni yuklashda xatolik: ' + err.message, 'error');
      })
      .getProducts();
  }

  // Tanlangan mahsulot uchun "yuklab olish" tugmasini yangilaydi
  function updateDownloadButton(mahsulot) {
    var btn = $('downloadBtn');
    var link = (mahsulot && state.productLinks) ? state.productLinks[mahsulot] : '';
    if (link) {
      var url = (String(link).indexOf('://') === -1) ? 'https://' + link : link;
      btn.href = url;
      btn.classList.remove('hidden');
    } else {
      btn.classList.add('hidden');
      btn.removeAttribute('href');
    }
  }

  // Mahsulotlar ro'yxatini (takrorlanmas) to'ldiradi
  function fillMahsulotSelect() {
    var sel = $('mahsulotSelect');
    sel.innerHTML = '<option value="">— Tanlang —</option>';
    var seen = {};
    state.pricing.forEach(function (p) {
      if (!p.mahsulot || seen[p.mahsulot]) return;
      seen[p.mahsulot] = true;
      var opt = document.createElement('option');
      opt.value = p.mahsulot;
      opt.textContent = p.mahsulot;
      sel.appendChild(opt);
    });
  }

  // Tanlangan mahsulotga tegishli muddatlarni to'ldiradi
  function fillMuddatiSelect(mahsulot) {
    var sel = $('muddatiSelect');
    if (!mahsulot) {
      sel.innerHTML = '<option value="">— Avval mahsulotni tanlang —</option>';
      return;
    }
    sel.innerHTML = '<option value="">— Tanlang —</option>';
    state.pricing.forEach(function (p) {
      if (p.mahsulot !== mahsulot) return;
      var opt = document.createElement('option');
      opt.value = p.muddat;
      opt.textContent = p.muddat + ' — ' + p.qiymati;
      sel.appendChild(opt);
    });
  }

  function onMahsulotChange() {
    var mahsulot = $('mahsulotSelect').value;
    fillMuddatiSelect(mahsulot);
    $('muddatiSelect').value = '';
    $('priceHint').classList.add('hidden');
    updateDownloadButton(mahsulot);
  }

  function onMuddatiChange() {
    var mahsulot = $('mahsulotSelect').value;
    var val = $('muddatiSelect').value;
    var item = state.pricing.filter(function (p) {
      return p.mahsulot === mahsulot && p.muddat === val;
    })[0];
    if (item) {
      // Buyurtmachi shu kartaga to'lov qiladi (ma'lumot uchun ko'rsatamiz).
      $('priceHint').classList.remove('hidden');
      $('priceHint').innerHTML = 'Narx: <strong>' + escapeHtml(item.qiymati) +
        '</strong><br>Quyidagi kartaga to\'lov qiling: <strong>' + escapeHtml(item.karta) + '</strong>';
    } else {
      $('priceHint').classList.add('hidden');
    }
  }

  function loadUserOrders() {
    google.script.run
      .withSuccessHandler(function (orders) {
        showLoader(false);
        renderOrderPanel(orders || []);
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        setMsg('orderMsg', 'Buyurtmalarni yuklashda xatolik: ' + err.message, 'error');
      })
      .getUserOrders(state.phone);
  }

  function renderOrderPanel(orders) {
    var latest = orders.length ? orders[0] : null;
    var box = $('existingOrderBox');
    var formBox = $('orderFormBox');
    var hasActivation = latest && latest.activationKey && latest.activationKey.trim() !== '';
    var status = latest ? (latest.holati || '').trim() : '';
    var isRejected = status === 'Rad etilgan';

    if (latest) {
      box.classList.remove('hidden');
      var badge;
      if (hasActivation) badge = '<span class="badge badge-active">Tasdiqlangan</span>';
      else if (isRejected) badge = '<span class="badge badge-rejected">Rad etilgan</span>';
      else badge = '<span class="badge badge-pending">Kutilmoqda</span>';

      var html = '';
      html += detailRow('Holati', badge, true);
      html += detailRow('Buyurtmachi F.I.O', latest.fio);
      html += detailRow('Mahsulot', latest.mahsulot);
      html += detailRow('Product Key', latest.productKey);
      html += detailRow('Muddati', latest.muddati);
      html += detailRow('To\'lov kartasi', latest.tolovKartasi);
      html += detailRow('To\'lov vaqti', latest.tolovVaqti);
      if (hasActivation) {
        html += '<div class="lic-box"><div class="lic-label">Activation Key (litsenziya):</div>' +
          '<div class="lic-value" id="licValue">' + escapeHtml(latest.activationKey) + '</div>' +
          '<button class="btn btn-ghost-dark btn-sm" onclick="copyLicense()">Nusxa olish</button></div>';
      } else if (isRejected) {
        html += '<div class="reject-note">Afsuski, buyurtmangiz rad etildi. Ma\'lumotlarni tekshirib, qaytadan buyurtma berishingiz mumkin.</div>';
      } else {
        html += '<div class="pending-note">Buyurtmangiz administrator tomonidan ko\'rib chiqilmoqda. Tasdiqlangach, litsenziya shu yerda paydo bo\'ladi.</div>';
      }
      $('existingOrderDetails').innerHTML = html;
    } else {
      box.classList.add('hidden');
    }

    if (hasActivation) {
      // Litsenziya berilgan -> "Qayta buyurtma berish" tugmasi
      formBox.classList.add('hidden');
      var reBtn = '<button class="btn btn-warning btn-block" onclick="startReorder()">Qayta buyurtma berish</button>';
      $('existingOrderDetails').innerHTML += reBtn;
    } else if (isRejected) {
      // Rad etilgan -> yangi buyurtma berish formasi (bo'sh)
      formBox.classList.remove('hidden');
      $('orderFormTitle').textContent = 'Qaytadan buyurtma berish';
      $('submitOrderBtn').textContent = 'Buyurtma berish';
      prefillForm(latest);
    } else {
      // Kutilmoqda yoki buyurtma yo'q -> forma
      formBox.classList.remove('hidden');
      $('orderFormTitle').textContent = latest ? 'Buyurtma ma\'lumotlari' : 'Yangi buyurtma berish';
      $('submitOrderBtn').textContent = 'Buyurtma berish';
      prefillForm(latest);
    }
  }

  function copyLicense() {
    var el = $('licValue');
    if (!el) return;
    navigator.clipboard.writeText(el.textContent).then(function () {
      alert('Litsenziya nusxa olindi.');
    });
  }

  function detailRow(k, v, isHtml) {
    return '<div class="detail-row"><span class="k">' + escapeHtml(k) +
      '</span><span class="v">' + (isHtml ? v : escapeHtml(v)) + '</span></div>';
  }

  function prefillForm(order) {
    if (order) {
      $('fioInput').value = order.fio || '';
      $('mahsulotSelect').value = order.mahsulot || '';
      fillMuddatiSelect(order.mahsulot || '');
      updateDownloadButton(order.mahsulot || '');
      $('productKeyInput').value = order.productKey || '';
      $('muddatiSelect').value = order.muddati || '';
      $('tolovKartasiInput').value = order.tolovKartasi || '';
      onMuddatiChange();
    }
    setDefaultTolovVaqti();
  }

  function setDefaultTolovVaqti() {
    if ($('tolovVaqtiInput').value) return;
    var now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    $('tolovVaqtiInput').value = now.toISOString().slice(0, 16);
  }

  // "Qayta buyurtma berish": bo'sh formani ochamiz
  function startReorder() {
    $('orderFormBox').classList.remove('hidden');
    $('orderFormTitle').textContent = 'Qayta buyurtma berish';
    $('submitOrderBtn').textContent = 'Buyurtma berish';
    $('fioInput').value = '';
    $('mahsulotSelect').value = '';
    fillMuddatiSelect('');
    updateDownloadButton('');
    $('productKeyInput').value = '';
    $('muddatiSelect').value = '';
    $('tolovKartasiInput').value = '';
    $('priceHint').classList.add('hidden');
    $('tolovVaqtiInput').value = '';
    setDefaultTolovVaqti();
    $('orderFormBox').scrollIntoView({ behavior: 'smooth' });
  }

  function submitOrder() {
    var data = {
      phone: state.phone,
      fio: $('fioInput').value.trim(),
      mahsulot: $('mahsulotSelect').value,
      productKey: $('productKeyInput').value.trim(),
      muddati: $('muddatiSelect').value,
      tolovKartasi: $('tolovKartasiInput').value.trim(),
      tolovVaqti: $('tolovVaqtiInput').value.trim()
    };

    // Mijoz tomonida validatsiya
    if (!data.fio) return setMsg('orderMsg', 'Buyurtmachi F.I.O ni kiriting.', 'error');
    if (!data.mahsulot) return setMsg('orderMsg', 'Mahsulotni tanlang.', 'error');
    if (!data.productKey) return setMsg('orderMsg', 'Product Key ni kiriting.', 'error');
    if (!data.muddati) return setMsg('orderMsg', 'Muddatini tanlang.', 'error');
    if (!data.tolovKartasi) return setMsg('orderMsg', 'To\'lov kartasi raqamini kiriting.', 'error');
    if (data.tolovKartasi.replace(/\D/g, '').length !== 16) {
      return setMsg('orderMsg', 'Karta raqami 16 ta raqamdan iborat bo\'lishi kerak (xxxx xxxx xxxx xxxx).', 'error');
    }
    if (!data.tolovVaqti) return setMsg('orderMsg', 'To\'lov vaqtini kiriting.', 'error');

    setMsg('orderMsg', '');
    $('submitOrderBtn').disabled = true;
    showLoader(true);

    google.script.run
      .withSuccessHandler(function (res) {
        showLoader(false);
        $('submitOrderBtn').disabled = false;
        if (!res.ok) {
          setMsg('orderMsg', res.message, 'error');
          return;
        }
        setMsg('orderMsg', res.message, 'success');
        // Panelni yangilaymiz
        loadUserOrders();
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        $('submitOrderBtn').disabled = false;
        setMsg('orderMsg', 'Server xatosi: ' + err.message, 'error');
      })
      .submitOrder(data);
  }

  // ===== ADMIN PANELI =====
  function openAdminPanel() {
    showView('adminView');
    loadAdminOrders();
  }

  function loadAdminOrders() {
    showLoader(true);
    google.script.run
      .withSuccessHandler(function (orders) {
        showLoader(false);
        state.adminOrders = orders || [];
        renderAdminStats();
        renderAdminTable(state.adminOrders);
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        alert('Buyurtmalarni yuklashda xatolik: ' + err.message);
      })
      .getAllOrders();
  }

  function renderAdminStats() {
    var total = state.adminOrders.length;
    var approved = 0, rejected = 0;
    state.adminOrders.forEach(function (o) {
      var hasKey = o.activationKey && o.activationKey.trim() !== '';
      var status = (o.holati || '').trim();
      if (hasKey || status === 'Tasdiqlangan') approved++;
      else if (status === 'Rad etilgan') rejected++;
    });
    var pending = total - approved - rejected;
    $('adminStats').innerHTML =
      statCard(total, 'Jami buyurtmalar') +
      statCard(pending, 'Kutilmoqda') +
      statCard(approved, 'Tasdiqlangan') +
      statCard(rejected, 'Rad etilgan');
  }

  function statCard(num, lbl) {
    return '<div class="stat-card"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  function renderAdminTable(orders) {
    var tbody = $('ordersTbody');
    tbody.innerHTML = '';
    if (!orders.length) {
      $('adminEmpty').classList.remove('hidden');
      return;
    }
    $('adminEmpty').classList.add('hidden');

    orders.forEach(function (o, idx) {
      var hasKey = o.activationKey && o.activationKey.trim() !== '';
      var status = (o.holati || '').trim();
      var isRejected = status === 'Rad etilgan';
      var isApproved = hasKey || status === 'Tasdiqlangan';
      var isClassifier = (o.mahsulot || '').toLowerCase().indexOf('klassifikator') !== -1;
      var tr = document.createElement('tr');

      // Holati ustuni
      var holatiCell;
      if (isApproved) holatiCell = '<span class="badge badge-active">Tasdiqlangan</span>';
      else if (isRejected) holatiCell = '<span class="badge badge-rejected">Rad etilgan</span>';
      else holatiCell = '<span class="badge badge-pending">Kutilmoqda</span>';

      // Activation Key (litsenziya) ustuni
      var keyCell = hasKey
        ? '<span class="lic-key" title="Litsenziya">' + escapeHtml(o.activationKey) + '</span>'
        : '<span class="muted">—</span>';

      // Amal ustuni
      var amalCell;
      if (isApproved) {
        amalCell = '<span class="muted">✔ berilgan</span>';
      } else if (isRejected) {
        // Rad etilgan buyurtmada amal tugmasi bo'lmaydi
        amalCell = '<span class="muted">—</span>';
      } else {
        // Faqat "Kutilmoqda" holatida tasdiqlash/rad etish mumkin
        amalCell = '<div class="act-cell">';
        if (isClassifier) {
          // RSA litsenziya avtomatik ishlab chiqiladi
          amalCell += '<button class="btn btn-success btn-sm" onclick="approveOrder(' + o.row + ',true)">Tasdiqlash (auto)</button>';
        } else {
          // Boshqa mahsulot -> kalit qo'lda kiritiladi
          amalCell += '<input class="key-input" id="mkey_' + o.row + '" placeholder="Activation key...">' +
            '<button class="btn btn-success btn-sm" onclick="approveOrder(' + o.row + ',false)">Tasdiqlash</button>';
        }
        amalCell += '<button class="btn btn-danger btn-sm" onclick="rejectOrder(' + o.row + ')">Rad etish</button>';
        amalCell += '</div>';
      }

      tr.innerHTML =
        '<td>' + (idx + 1) + '</td>' +
        '<td>' + escapeHtml(o.fio) + '</td>' +
        '<td>' + escapeHtml(formatPhoneStr(o.telefon)) + '</td>' +
        '<td>' + escapeHtml(o.mahsulot) + '</td>' +
        '<td>' + escapeHtml(o.productKey) + '</td>' +
        '<td>' + escapeHtml(o.muddati) + '</td>' +
        '<td>' + escapeHtml(o.tolovKartasi) + '</td>' +
        '<td>' + escapeHtml(o.tolovVaqti) + '</td>' +
        '<td>' + holatiCell + '</td>' +
        '<td>' + keyCell + '</td>' +
        '<td>' + amalCell + '</td>';
      tbody.appendChild(tr);
    });
  }

  // Buyurtmani tasdiqlash.
  // isAuto=true bo'lsa (klassifikator) server RSA litsenziya yaratadi;
  // aks holda admin kiritgan kalit (mkey_<row>) yuboriladi.
  function approveOrder(row, isAuto) {
    var manualKey = '';
    if (isAuto) {
      if (!confirm('Buyurtmani tasdiqlaysizmi? Litsenziya (Activation key) avtomatik ishlab chiqiladi.')) return;
    } else {
      var input = $('mkey_' + row);
      manualKey = input ? input.value.trim() : '';
      if (!manualKey) { alert('Activation key ni kiriting.'); return; }
    }
    showLoader(true);
    google.script.run
      .withSuccessHandler(function (res) {
        showLoader(false);
        if (!res.ok) { alert(res.message); return; }
        loadAdminOrders();
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        alert('Server xatosi: ' + err.message);
      })
      .approveOrder(state.phone, row, manualKey);
  }

  // Buyurtmani rad etish
  function rejectOrder(row) {
    if (!confirm('Buyurtmani rad etasizmi?')) return;
    showLoader(true);
    google.script.run
      .withSuccessHandler(function (res) {
        showLoader(false);
        if (!res.ok) { alert(res.message); return; }
        loadAdminOrders();
      })
      .withFailureHandler(function (err) {
        showLoader(false);
        alert('Server xatosi: ' + err.message);
      })
      .rejectOrder(state.phone, row);
  }

  function filterAdminOrders() {
    var q = $('adminSearch').value.toLowerCase().trim();
    if (!q) { renderAdminTable(state.adminOrders); return; }
    var filtered = state.adminOrders.filter(function (o) {
      return (o.fio + ' ' + o.telefon + ' ' + o.productKey + ' ' + o.muddati)
        .toLowerCase().indexOf(q) !== -1;
    });
    renderAdminTable(filtered);
  }

  // ===== CHIQISH =====
  function logout() {
    state.phone = '';
    state.isAdmin = false;
    $('phoneInput').value = '+998';
    $('passwordInput').value = '';
    backToPhone();
    setMsg('orderMsg', '');
    showView('loginView');
  }

  // ===== Hodisalarni ulash =====
  document.addEventListener('DOMContentLoaded', function () {
    $('phoneBtn').addEventListener('click', submitPhone);
    $('passwordBtn').addEventListener('click', submitPassword);
    $('changePhoneBtn').addEventListener('click', backToPhone);
    $('submitOrderBtn').addEventListener('click', submitOrder);
    $('mahsulotSelect').addEventListener('change', onMahsulotChange);
    $('muddatiSelect').addEventListener('change', onMuddatiChange);
    $('adminSearch').addEventListener('input', filterAdminOrders);

    var cardEl = $('tolovKartasiInput');
    cardEl.addEventListener('input', function () { formatCardInput(cardEl); });

    var phoneEl = $('phoneInput');
    phoneEl.addEventListener('input', function () { normalizePhoneInput(phoneEl); });
    phoneEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitPhone(); });
    $('passwordInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitPassword(); });
  });
</script>
